<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}dedupe{% endblock %}</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.4 -apple-system, system-ui, sans-serif; margin: 0; }
  header { padding: .75rem 1.5rem; border-bottom: 1px solid #8883; display: flex; gap: 1.5rem; align-items: center; }
  header a { text-decoration: none; color: inherit; font-weight: 600; }
  header nav { display: flex; gap: 1rem; font-weight: normal; }
  main { padding: 1.5rem; max-width: 1100px; margin: 0 auto; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 1.5rem; }
  th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #8882; font-size: 13px; }
  th { opacity: .6; font-weight: 600; }
  .path { font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; }
  .group { border: 1px solid #8883; border-radius: 8px; padding: .75rem 1rem; margin-bottom: 1rem; }
  .group-header { font-weight: 600; margin-bottom: .5rem; }
  .muted { opacity: .6; }
  .stat { display: inline-block; margin-right: 2rem; }
  .stat b { display: block; font-size: 1.4rem; }
  button, .btn { font: inherit; padding: .35rem .8rem; border-radius: 6px; border: 1px solid #8886; background: transparent; cursor: pointer; color: inherit; }
  button.danger { border-color: #c44; color: #c44; }
  .staged { opacity: .5; text-decoration: line-through; }
</style>
</head>
<body>
<header>
  <a href="/legacy">dedupe (legacy)</a>
  <nav>
    <a href="/duplicates">Exact duplicates</a>
    <a href="/similar">Similar images</a>
    <a href="/">← Back to new UI</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
