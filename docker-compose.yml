services:
  dedupe:
    build: .
    image: dedupe:local
    container_name: dedupe
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Single-volume dedup mode (legacy dashboard, /legacy) still scans
      # exactly these paths — unrelated to the whole-volume mounts below.
      SCAN_ROOTS: "/volume1/photos:/volume1/documents"
      WORKERS: "4"
      PHASH_THRESHOLD: "5"
      # Comparison mode's browse roots (GET /api/browse, folder picker) are
      # auto-discovered from whichever /volumeN or /volumeUSBn mounts below
      # actually exist inside the container — no env var needed for the
      # common case. This ADDS a non-standard mount name on top of the
      # auto-discovered ones (it no longer replaces them, unlike before):
      # BROWSE_ROOTS: "/some-other-mount-name"
    volumes:
      # One entry per physical volume/drive dedupe should be able to see at
      # all. Host path == container path deliberately (no /data/... alias)
      # so paths shown in the UI and stored in the DB match the NAS's real
      # paths.
      #
      # Per-volume choice, made once here:
      #   :ro        -> browsable only, never a valid comparison-mode copy
      #                 target (the safe default for source/archival data)
      #   (no :ro)   -> browsable AND selectable as a copy target — still
      #                 additive-only at the app level, never overwrites or
      #                 deletes existing files. Whether a volume is a valid
      #                 copy target is driven entirely by this flag — there's
      #                 no separate allowlist to also keep in sync.
      #
      # New volume/drive later = one line here + `docker compose up -d`
      # (restart required — Docker only sees mounts present at container
      # start; a drive attached while the container is already running
      # needs a restart to become visible).
      - /volume1:/volume1:ro
      - /volume2:/volume2
      - /volumeUSB1:/volumeUSB1:ro
      # SQLite index and staging folder. Housed under a dot-prefixed folder
      # name (.dedupe) so they don't ALSO show up as regular browsable
      # folders via the /volume1 mount above — app/browse.py already
      # filters dot-prefixed entries out of the picker.
      - /volume1/docker/.dedupe/config:/config
      - /volume1/docker/.dedupe/staging:/staging
    deploy:
      resources:
        limits:
          memory: 4g
